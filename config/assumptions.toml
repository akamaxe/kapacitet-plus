# ------------------------------------------------------- phase of each connection (unbalance)
[pv_single_phase_max_kva]
value = 4.6
unit = "kVA"
tag = "team-assumption"
label = "Inverter rating at or below which rooftop PV is connected to a single phase"
label_sv = "Växelriktarens märkeffekt upp till och med vilken takmonterade solceller ansluts enfasigt"
source = "The single-phase infeed limit used across Europe (VDE-AR-N 4105 caps the unbalance a single-phase generator may cause at 4.6 kVA); EN 50549-1 leaves the figure to national rules"
url = ""
note = "To be confirmed against the Swedish connection rules (Energiforetagen AMP) before this leaves a demonstration. Above the limit the inverter is three-phase and contributes no unbalance."
note_sv = "Behöver bekräftas mot de svenska anslutningsreglerna (Energiföretagen AMP) innan detta används utanför en demonstration. Över gränsen är växelriktaren trefasig och bidrar inte till någon obalans."

[phase_allocation]
value = "round_robin"
unit = "-"
tag = "team-assumption"
label = "How single-phase connections are spread over the three phases"
label_sv = "Hur enfasiga anslutningar fördelas på de tre faserna"
source = "Modelling choice: an installer working along a street balances the phases as it goes, which is the favourable case"
url = ""
note = "The alternative value is 'random', the unfavourable case where nobody keeps track. The gap between the two is the cost of not recording the phase of each service, and it is worth reporting."
note_sv = "Det alternativa värdet är 'random', det ogynnsamma fallet där ingen håller reda på faserna. Skillnaden mellan de två är kostnaden för att inte registrera fasen för varje servisledning, och den är värd att redovisa."

# ------------------------------------------------- zero sequence (unbalanced three-phase model)
[cable_r0_r1_ratio]
value = 4.0
unit = "-"
tag = "team-assumption"
label = "Zero- to positive-sequence resistance ratio of the four-core LV cables"
label_sv = "Förhållande mellan resistans i nollföljd och i plusföljd hos lågspänningskablar med fyra ledare"
source = "Z0 = Z1 + 3*Zn for a cable whose neutral has the same cross-section as the phases; NAYY 4x150 SE and 4x50 SE are four-core of equal section, so Zn = Z1 and the ratio is 4"
url = ""
note = "The IEEE European LV Test Feeder, whose cable data is measured rather than derived, gives 3.4 for its own cables."
note_sv = "IEEE European LV Test Feeder, vars kabeldata är uppmätta och inte härledda, ger 3,4 för sina egna kablar."

[cable_x0_x1_ratio]
value = 4.0
unit = "-"
tag = "team-assumption"
label = "Zero- to positive-sequence reactance ratio of the four-core LV cables"
label_sv = "Förhållande mellan reaktans i nollföljd och i plusföljd hos lågspänningskablar med fyra ledare"
source = "Same four-wire derivation as the resistance ratio"
url = ""
note = "Weaker than the resistance ratio, because the zero-sequence reactance depends on conductor geometry and on the earth return path. The IEEE European LV Test Feeder gives 1.2 for its cables. This is the dominant uncertainty of the unbalanced model and has to be swept once it drives the engine."
note_sv = "Svagare underbyggt än resistansförhållandet, eftersom nollföljdsreaktansen beror på ledarnas geometri och på returvägen genom jord. IEEE European LV Test Feeder ger 1,2 för sina kablar. Det är den dominerande osäkerheten i den obalanserade modellen och måste varieras i ett parametersvep när den väl styr beräkningsmotorn."

[trafo_vk0_vk_ratio]
value = 1.0
unit = "-"
tag = "team-assumption"
label = "Zero- to positive-sequence short-circuit voltage of the Dyn transformer"
label_sv = "Förhållande mellan kortslutningsspänning i nollföljd och i plusföljd hos Dyn-transformatorn"
source = "Follows the Dyn unit of pandapower's IEEE European LV Test Feeder, which sets vk0 = vk and scales vkr0 with it"
url = ""
note = "A Dyn transformer keeps zero-sequence current on the LV side, so this ratio sets how stiff that path is."
note_sv = "En Dyn-transformator håller kvar nollföljdsströmmen på lågspänningssidan, så förhållandet avgör hur styv den vägen är."

[trafo_mag0_percent]
value = 100.0
unit = "%"
tag = "team-assumption"
label = "Zero-sequence magnetising impedance of the transformer, over its short-circuit impedance"
label_sv = "Transformatorns magnetiseringsimpedans i nollföljd, i förhållande till dess kortslutningsimpedans"
source = "Set high on purpose, so the delta winding provides the zero-sequence path and the magnetising branch does not"
url = ""
note = "pandapower's split of the zero-sequence impedance between windings (si0_hv_partial) is kept at the 0.9 its own Dyn examples use."
note_sv = "Fördelningen av nollföljdsimpedansen mellan lindningarna i pandapower (si0_hv_partial) hålls kvar på de 0,9 som bibliotekets egna Dyn-exempel använder."

