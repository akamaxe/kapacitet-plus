# Model inputs of Kapacitet+. Every entry is shown in the UI's "Method & Data" page.
#   tag = sourced          value taken from the cited source
#         regulation       legal/standard limit
#         library          standard component data (pandapower standard types, pvlib defaults)
#         derived          computed from real data in this project (see note)
#         team-assumption  our modelling choice, to be validated (always listed as such)

# ---------------------------------------------------------------- voltage and thermal limits
[v_max_pu]
value = 1.10
unit = "pu"
tag = "regulation"
label = "Upper voltage limit at customer connection"
source = "Ei EIFS 2023:3 (slow voltage variations within ±10 % of the reference voltage, 10-min means); EN 50160"
url = "https://ei.se/bransch/eloverforingens-kvalitet/spanningskvalitet-i-elnatet/spanningskvalitet---vagledning-eifs-20233"
note = "Applied to hourly values; hourly means hide sub-hourly peaks (see v_margin_pu)."

[v_min_pu]
value = 0.90
unit = "pu"
tag = "regulation"
label = "Lower voltage limit at customer connection"
source = "Ei EIFS 2023:3; EN 50160"
url = "https://ei.se/bransch/eloverforingens-kvalitet/spanningskvalitet-i-elnatet/spanningskvalitet---vagledning-eifs-20233"
note = ""

[v_margin_pu]
value = 0.01
unit = "pu"
tag = "team-assumption"
label = "Planning margin on voltage limits"
source = "Covers the gap between hourly simulation and the 10-minute means of EIFS 2023:3"
url = ""
note = "Same margin for every method (static, time series, DOE). Varied in the tornado chart."

[thermal_limit_pct]
value = 100.0
unit = "%"
tag = "team-assumption"
label = "Maximum loading of cables and transformer"
source = "Continuous rating of the pandapower standard types"
url = ""
note = "Reverse power flow through the transformer is allowed up to its rating."

[mv_voltage_pu]
value = 1.00
unit = "pu"
tag = "team-assumption"
label = "MV (10 kV) voltage at the secondary substation"
source = "No measurement available; planning value, identical for every method"
url = ""
note = "Varied 0.98–1.03 pu in the tornado chart."

[trafo_tap_pos]
