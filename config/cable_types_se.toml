# Swedish low-voltage cable types, for a network export's cable names (importer/cables.py).
#
# Each type has its resistance (r, ohm/km), reactance (x, ohm/km), capacitance (c, nF/km) and
# current rating (max_i, kA) from its manufacturer's datasheet, with the document (source), its
# address (url) and the day it was read (accessed). A type without the three does not enter the
# catalogue (cables.catalogue refuses it), and tests/test_cables.py checks every one.

