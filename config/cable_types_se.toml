c_nf_per_km = 0.0
max_i_ka = 0.117
rating = "three-phase, buried directly in the ground (D2), ground 20 °C, conductor 90 °C"
source = "Nexans, AXQJ Easy 1 kV 4X50/16: max. DC resistance of the conductor at 20 °C 0.641 ohm/km, nominal inductance 0.21 mH/km; current ratings of the AXQJ/IFSI/AMCMK HF Easy 1 kV family, aluminium, D2"
url = "https://www.nexans.no/en/products/Building-Wires-and-Cables/Low-fire-hazard-cables/Low-fire-hazard-Installation-cables/IFSI-EASY™-1-kV/product~10573741~.html"
accessed = "2026-11-15"
note = "x = 2 pi 50 Hz times the nominal inductance; r is the datasheet's at 20 °C; the datasheet gives no capacitance, so c = 0 (its charging is negligible at 0.4 kV)"

