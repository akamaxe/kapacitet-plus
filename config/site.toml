# Study scope for Kapacitet+. Physical model inputs live in assumptions.toml.

[site]
name = "Smedslätten, Bromma (Stockholm)"
# Centre = the OSM-mapped nätstation (minor distribution substation) at Smedslättsvägen 71A.
center_lat = 59.32326
center_lon = 17.96127
# OSM element pinned as the root of the LV network. Empty: use the nearest mapped
# minor_distribution substation, or the load-weighted 1-median of the street graph if none.
substation_osm = "way/387760094"
# Radius of the OpenStreetMap extract (buildings, streets, mapped substations).
osm_radius_m = 900
# The synthetic LV network covers the houses of the substation's street-network Voronoi cell
# (against the other mapped substations), capped by:
max_houses = 120
max_network_distance_m = 900
bidding_zone = "SE3"
# eSett metering grid area used only to validate the household load shape (Ellevio, Stockholm).
metering_grid_area = "STH"

[time]
reference_year = 2025
weather_first_year = 2015
weather_last_year = 2025
# Hour-of-day views use Swedish standard time (UTC+1) without daylight saving time.
display_utc_offset_h = 1

[smhi]
temperature_station = 97200          # Stockholm-Bromma Flygplats (hourly)
strang_ghi = 117                     # global horizontal irradiance, W/m2
strang_dni = 118                     # direct normal irradiance, W/m2
# Diffuse horizontal irradiance (122) is only published from ~2020, so it is derived for every
# year from STRÅNG's own closure GHI = DNI·cos(z) + DHI; 122 is kept for validation.
strang_dhi = 122

[prices]
zones = ["SE1", "SE2", "SE3", "SE4"]
first_year = 2023
last_year = 2025

[national]
year = 2025

[network]
http_user_agent = "Kapacitet-plus/0.1 (KTH EI2600 student project)"
overpass_endpoints = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter",
]

# Other Bromma villa areas (select with `python -m kapacitet --site <key> ...`).
# No nätstation is mapped there, so the substation is placed at the 1-median (synthetic position).
[alternatives.olovslund]
name = "Olovslund, Bromma (Stockholm)"
center_lat = 59.3309
center_lon = 17.9409
substation_osm = ""

[alternatives.hoglandet]
name = "Höglandet, Bromma (Stockholm)"
center_lat = 59.3235
center_lon = 17.9369
substation_osm = ""

[alternatives.norra_angby]
name = "Norra Ängby, Bromma (Stockholm)"
center_lat = 59.3479
center_lon = 17.9071
substation_osm = ""
