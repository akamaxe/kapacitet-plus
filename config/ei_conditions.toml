# Ei's conditions for conditional connection agreements (villkorade avtal), as Ei states them in its
# position paper Ei2025:01 (version 1.1, 26 June 2026), and the kind of evidence this prototype can
# give for each (engine/eipack.py):
#
#   model        the simulation shows whether it holds, with its figures
#   declaration  only the DSO can state it (DSO settings); an empty statement never counts as met
#
# Evidence, never a legal conclusion: whether a condition is met in law is Ei's and a court's to say.
# Every condition has its label in English and Swedish and its source; tests/test_eipack.py holds them.

[source]
title = "Energimarknadsinspektionen, Ställningstagande Villkorade avtal Ei2025:01, version 1.1 (26 June 2026)"
url = "https://ei.se/om-oss/publikationer/publikationer/stallningstagande/stallningstagande-villkorade-avtal-ei202501"

[[condition]]
key = "capacity_shortage"
evidence = "model"
label = "Signed only where the grid has little or no capacity left"
label_sv = "Tecknas endast där nätet har begränsad eller ingen kvarvarande kapacitet"
source = "Ei2025:01 §2.4; ellagen 4 kap. 1 och 2 §§"

[[condition]]
key = "market_first"
evidence = "declaration"
label = "Market-based alternatives investigated first and found lacking"
label_sv = "Marknadsbaserade alternativ har utretts först och visat sig otillräckliga"
source = "Ei2025:01 §2.3; artikel 13.3, förordning (EU) 2019/943"

[[condition]]
key = "method_approved"
evidence = "declaration"
label = "The method for the agreements' terms approved by Ei before any agreement"
label_sv = "Metoden för avtalsvillkoren godkänd av Ei innan något avtal tecknas"
source = "Ei2025:01 §2.2; ellagen 4 kap. 46 §"

[[condition]]
key = "terms_how_when"
evidence = "model"
label = "The terms say how and when transfer may be limited, and when the limit ends"
label_sv = "Villkoren anger hur och när överföringen får begränsas och när begränsningen upphör"
source = "Ei2025:01 §2.2"

[[condition]]
key = "only_when_overloaded"
evidence = "model"
label = "Limited only when the grid would otherwise be overloaded"
label_sv = "Begränsas endast när nätet annars skulle överbelastas"
source = "Ei2025:01 §2.3"

[[condition]]
key = "after_market_result"
evidence = "model"
label = "Activated only once the market result shows an overload"
label_sv = "Aktiveras endast när marknadsutfallet visar en överbelastning"
source = "Ei2025:01 §2.3"

[[condition]]
key = "annual_report"
evidence = "model"
label = "The use of non-market redispatch analysed and reported to Ei every year"
label_sv = "Användningen av icke marknadsbaserad omdirigering analyseras och rapporteras till Ei varje år"
source = "Ei2025:01 §2.1; artikel 13.4, förordning (EU) 2019/943"

[[condition]]
key = "review_when_changed"
evidence = "model"
label = "Each agreement reviewed when the grid's capacity or the market changes"
label_sv = "Varje avtal prövas på nytt när nätets kapacitet eller marknaden förändras"
source = "Ei2025:01 §2.3"
