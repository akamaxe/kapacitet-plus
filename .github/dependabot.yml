# Weekly update proposals for everything the build pins: the actions' commit SHAs in the workflows,
# the interface's npm lockfile, the Python pins in constraints.txt and the Dockerfile's base images
# (their digests). Each one is a pull request that CI checks; nothing merges by itself.
# A major version is a decision, not a weekly update, so no ecosystem proposes one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    # the ceilings constraints.txt explains, all set by pandapower 3.5: it declares numpy below
    # 2.5 and pandas ~=2.3 (pandas 3's copy-on-write breaks how it writes results), and its next
    # major is a migration of its own, as 2.14 to 3 was
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: numpy
        versions: [">=2.5"]
      - dependency-name: pandas
        versions: [">=3"]
      - dependency-name: pandapower
        versions: [">=4"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # new digests of the same line; a new Node or Python line is a decision, not a weekly update
    ignore:
      - dependency-name: node
        versions: [">=25"]
      - dependency-name: python
        versions: [">=3.13"]

  # the codespace's base image and features, which are taken by tag
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
