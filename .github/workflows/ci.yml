# Checks that run on every push without the pipeline output (data/ is not in the repository):
# the interface typechecks, passes its unit tests and builds; the Python tests pass, those that
# need data skipping themselves (tests/conftest.py), while the solver, screen and envelope safety
# tests run on the committed tiny grid (tests/fixtures/grid_tiny); the interface explains a fresh
# clone end to end; the pinned dependencies have no known vulnerability (npm: none high or worse)
# that the audit job does not explain; the image builds, runs unprivileged and answers.
# Every action is pinned to a commit (the comment says which release), and Dependabot proposes the
# next one (.github/dependabot.yml).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: python -m pytest

  # the interface against the real API on a fresh clone (no data): the setup screen and /health.
  # Playwright drives the runner's preinstalled Chrome, so no browser is downloaded.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          KAPACITET_PY: python

  # known vulnerabilities in what the project pins: the Python constraints, resolved with their own
  # dependencies, and the packages the interface ships (not the tools that build it)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      # GHSA-rgxp-2hwp-jwgg (PYSEC-2026-113, CVE-2026-25087; pyarrow below 23.0.1) is in Arrow's
      # IPC file reader with pre-buffering, which the project never calls: it reads only Parquet.
      # Remove the two ignores when constraints.txt moves pyarrow to 23.0.1 or later.
      - run: pip-audit -r constraints.txt --ignore-vuln GHSA-rgxp-2hwp-jwgg --ignore-vuln PYSEC-2026-113
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t kapacitet .
      # the server runs unprivileged (Dockerfile: USER 10001), never as root
      - run: |
          uid=$(docker run --rm kapacitet id -u)
          echo "the image runs as uid $uid"
          test "$uid" != 0
      # without data the API still answers, and /health says what is missing. The port is published
      # on 127.0.0.1 only, as the README and the Dockerfile say to run it: the API has no login.
      - run: |
          docker run -d --name kapacitet -p 127.0.0.1:8000:8000 kapacitet
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          if ! curl -fs http://127.0.0.1:8000/api/v1/health | grep -q '"status":"ok"'; then docker logs kapacitet; exit 1; fi
          curl -fs http://127.0.0.1:8000/ | grep -q '<div id="root">'
          # the one folder the server writes to is its own
          docker exec kapacitet sh -c 'test "$(id -u)" != 0 && test -w /app/data'
          docker rm -f kapacitet
