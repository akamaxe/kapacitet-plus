# Checks that run on every push without the pipeline output (data/ is not in the repository):
# the interface typechecks, passes its unit tests and builds; the Python tests pass, those that
# need data skipping themselves (tests/conftest.py), while the solver, screen and envelope safety
# tests run on the committed tiny grid (tests/fixtures/grid_tiny); the interface explains a fresh
# clone end to end; the pinned dependencies have no known vulnerability (npm: none high or worse)
# that the audit job does not explain; the image builds, runs unprivileged and answers.
# Every action is pinned to a commit (the comment says which release), and Dependabot proposes the
# next one (.github/dependabot.yml).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints.txt -e ".[dev,forecast,postgres]"
      - run: python -m pytest

  # the server's state in PostgreSQL (kapacitet.store): the state tests and the suite's tests of the
  # store on both backends, against a postgres:17 service pinned by digest. The database is the
  # runner's own and is emptied by the tests (its name must say test).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_USER: kapacitet
          POSTGRES_DB: kapacitet_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kapacitet -d kapacitet_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      KAPACITET_TEST_DATABASE_URL: postgresql://kapacitet@127.0.0.1:5432/kapacitet_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints.txt -e ".[dev,forecast,postgres]"
      - run: python -m pytest tests/test_store.py
      - run: >-
          python -m pytest tests/test_queue.py tests/test_inbox.py tests/test_apply.py tests/test_seals.py
          tests/test_seal_signatures.py tests/test_market.py tests/test_api_offline.py tests/test_atomic.py
          tests/test_store.py
        env:
          KAPACITET_TEST_BACKEND: postgres

  # the interface against the real API on a fresh clone (no data): the setup screen and /health.
  # Playwright drives the runner's preinstalled Chrome, so no browser is downloaded.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints.txt -e ".[dev,forecast]"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
        env:
          KAPACITET_PY: python

  # known vulnerabilities in what the project pins: the Python constraints, resolved with their own
  # dependencies, and the packages the interface ships (not the tools that build it)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r constraints.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t kapacitet .
      # the server runs unprivileged (Dockerfile: USER 10001), never as root
      - run: |
          uid=$(docker run --rm kapacitet id -u)
          echo "the image runs as uid $uid"
          test "$uid" != 0
      # without data the API still answers, and /health says what is missing. The port is published
      # on 127.0.0.1 only, as the README and the Dockerfile say to run it: the API has no login.
      - run: |
          docker run -d --name kapacitet -p 127.0.0.1:8000:8000 kapacitet
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
          if ! curl -fs http://127.0.0.1:8000/api/v1/health | grep -q '"status":"ok"'; then docker logs kapacitet; exit 1; fi
          curl -fs http://127.0.0.1:8000/ | grep -q '<div id="root">'
          # the one folder the server writes to is its own
          docker exec kapacitet sh -c 'test "$(id -u)" != 0 && test -w /app/data'
          docker rm -f kapacitet
