# The Python tests with the published data, once a week and on demand. The CI of every push runs
# without data (data/ is not in the repository), so the tests that need the reference network skip
# there; here the pinned data release is downloaded, checked against its sha256 in
# config/data-release.json, unpacked, and the whole suite runs on it. It is the run that saw the
# order-dependent failure of 13-11-2026 (tests/test_cache.py), which the push CI could not see.
# The ENTSO-E price files never travel in the release, so the figures that need prices before 2023
# have only 2023-2025 here, as in a codespace.
name: data-suite

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-with-data:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c constraints.txt -e ".[dev,forecast,postgres,validation,telemetry,timestamp]"
      - name: Download, check and unpack the pinned data release
        run: |
          set -euo pipefail
          url=$(python -I -c 'import json; print(json.load(open("config/data-release.json", encoding="utf-8"))["url"])')
          sha=$(python -I -c 'import json; print(json.load(open("config/data-release.json", encoding="utf-8"))["sha256"])')
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/kapacitet-data.zip" "$url"
          echo "$sha  $RUNNER_TEMP/kapacitet-data.zip" | sha256sum -c -
          python -m kapacitet unbundle "$RUNNER_TEMP/kapacitet-data.zip" --expect-sha256 "$sha"
          test -f data/processed/results/showcase.json
      - run: python -m pytest -p no:cacheprovider -rfE
      # five stations of a synthetic study built for real, with the default number of processes; the
      # table of seconds, disk and memory goes to the run's summary (task 2.7 of the technical review)
      - name: Build five stations and time them
        env:
          KAPACITET_SCALE_TEST: "1"
        run: python -m pytest tests/test_study_scale.py -k five -p no:cacheprovider -rfE -s
