[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kapacitet"
version = "0.1.0"
description = "Kapacitet+: digital twin of a Swedish LV neighbourhood comparing static hosting capacity with Dynamic Operating Envelopes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  # the engine's power flow is pandapower 3's; constraints.txt explains the ceilings it sets
  "numpy>=2,<2.5",
  "pandas>=2.3,<3",
  "scipy>=1.15",
  "pandapower>=3.5,<4",
  "lxml>=6.1",         # pandapower 3's CGMES converter (importer/cim.py) parses with it
  "cvxpy>=1.8",
  "clarabel>=0.9",
  "networkx>=3",
  "shapely>=2",
  "pyproj>=3.6",
  "requests>=2.31",
  "pvlib>=0.11",
  "pyarrow>=23.0.1",
  "duckdb>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",       # the API's live checks (/now, /sources/status)
  "cryptography>=50",  # Ed25519 signatures on every seal (seals.py)
  "authlib>=1.9.5,<2", # sign-in with the DSO's identity provider (auth.py, KAPACITET_AUTH=oidc), with joserfc
]

[project.optional-dependencies]
# richardsonpy is GPL-3.0; it is only used by the offline household-profile generator.
profiles = ["richardsonpy>=0.2.3"]
dev = ["pytest>=8", "httpx>=0.27"]
# the forecast variant of the intraday replica (engine/nowcast.py); CI installs it with dev
forecast = ["lightgbm>=4.7,<5"]
# the server's state in PostgreSQL instead of data/requests (kapacitet.store, KAPACITET_DATABASE_URL)
postgres = ["psycopg[binary]>=3.3,<4"]

[project.scripts]
kapacitet = "kapacitet.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kapacitet.study" = ["templates/*.md", "templates/cases_sv/*.md"]
"kapacitet.store" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
