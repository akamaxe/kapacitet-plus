[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kapacitet"
version = "0.1.0"
description = "Kapacitet+: digital twin of a Swedish LV neighbourhood comparing static hosting capacity with Dynamic Operating Envelopes (KTH EI2600)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "pandapower>=2.14",
  "cvxpy>=1.5",
  "clarabel>=0.9",
  "networkx>=3",
  "shapely>=2",
  "pyproj>=3.6",
  "requests>=2.31",
  "pvlib>=0.11",
  "pyarrow>=15",
  "duckdb>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# richardsonpy is GPL-3.0; it is only used by the offline household-profile generator.
profiles = ["richardsonpy>=0.2.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
kapacitet = "kapacitet.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
